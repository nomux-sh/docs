name: PR checks

# These jobs call the shared workflows of the organization.
# They are in a separate file from ci.yml: if a called workflow cannot be
# resolved, GitHub fails the complete workflow file at startup. The build job
# in ci.yml must not depend on the state of another repository.

on:
  pull_request:
    # `edited` runs commitlint again when the title of the pull request changes.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    uses: nomux-sh/.github/.github/workflows/dco.yml@main

  commitlint:
    name: commitlint
    uses: nomux-sh/.github/.github/workflows/commitlint.yml@main

  repo-lint:
    name: repo-lint
    uses: nomux-sh/.github/.github/workflows/repo-lint.yml@main
    with:
      license: docs
      require-changelog: false
