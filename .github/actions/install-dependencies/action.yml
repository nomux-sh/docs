name: Install dependencies
description: Installs Bun, restores the caches and installs the packages from the lockfile.

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Restore the package cache and the Astro build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.bun/install/cache
          node_modules/.astro
        key: site-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Install the packages
      shell: bash
      run: bun install --frozen-lockfile
