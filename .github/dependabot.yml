version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/install-dependencies
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        update-types: ["minor", "patch"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    groups:
      bun:
        update-types: ["minor", "patch"]
